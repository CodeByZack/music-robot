<!doctype html>
<meta charset="utf-8">
<title>music-robot · B 方案（顶栏 + 播放优先）</title>
<style>
  :root{--bg:#fff;--fg:#14171a;--mut:#5d6b7a;--line:#e3e8ef;--wash:#f2f5f8;
        --bar:#fbfcfd;--accent:#c2410c;--hover:#f6f8fa}
  @media (prefers-color-scheme:dark){
    :root{--bg:#0f1418;--fg:#eef2f6;--mut:#9aa8b6;--line:#243039;--wash:#181f26;
          --bar:#141b21;--accent:#fb923c;--hover:#1e272e}}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--fg);display:flex;flex-direction:column;
       font:14px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}

  /* 顶栏：导航是次要的，搜索是主要的 */
  header{flex:none;height:56px;display:flex;align-items:center;gap:22px;
         padding:0 22px;border-bottom:1px solid var(--line);background:var(--bar)}
  .brand{font-weight:650;letter-spacing:.2px;font-size:15px;flex:none}
  nav{display:flex;gap:4px;flex:none}
  nav a{padding:6px 12px;border-radius:7px;color:var(--mut);text-decoration:none;font-size:13.5px}
  nav a.on{color:var(--fg);background:var(--wash);font-weight:600}
  nav a:hover{background:var(--hover);color:var(--fg)}
  .spacer{flex:1}
  .search{width:260px;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--bg);
          color:var(--mut);display:flex;align-items:center;padding:0 12px;gap:8px;font-size:13px}
  /* 任务：只在有活儿时出现的状态胶囊，不是常驻导航 */
  .task{display:flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:99px;
        border:1px solid var(--accent);color:var(--accent);font-size:12.5px;flex:none}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
  .me{width:30px;height:30px;border-radius:50%;background:var(--wash);border:1px solid var(--line);flex:none}

  main{flex:1;overflow:auto;padding:26px 22px 34px}
  h2{font-size:19px;margin:0 0 14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px}
  .card{padding:11px;border-radius:10px;cursor:pointer}
  .card:hover{background:var(--hover)}
  .cover{aspect-ratio:1;border-radius:8px;background:var(--wash);border:1px solid var(--line);
         display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:22px}
  .t1{margin-top:9px;font-size:13.5px;font-weight:550;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .t2{font-size:12.5px;color:var(--mut);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

  /* 播放条：全app最常驻、也最该做好的东西 */
  footer{flex:none;height:74px;display:flex;align-items:center;gap:18px;padding:0 22px;
         border-top:1px solid var(--line);background:var(--bar)}
  .art{width:46px;height:46px;border-radius:7px;background:var(--wash);border:1px solid var(--line);
       display:flex;align-items:center;justify-content:center;color:var(--mut);flex:none}
  .now{min-width:0;width:200px;flex:none}
  .ctrls{display:flex;align-items:center;gap:6px;flex:none}
  .btn{width:32px;height:32px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--mut)}
  .btn svg,.play svg{display:block}
  .btn:hover{background:var(--hover);color:var(--fg)}
  .play{width:36px;height:36px;border-radius:50%;background:var(--fg);color:var(--bg);
        display:flex;align-items:center;justify-content:center;font-size:13px}
  .prog{flex:1;display:flex;align-items:center;gap:11px;min-width:0}
  .track{flex:1;height:4px;border-radius:99px;background:var(--wash);position:relative;min-width:0}
  .track>i{position:absolute;inset:0 70% 0 0;background:var(--accent);border-radius:99px}
  .track>b{position:absolute;left:30%;top:-4px;width:12px;height:12px;border-radius:50%;
           background:var(--fg);opacity:0}
  .track:hover>i{background:var(--accent)}
  .tm{font-size:11.5px;color:var(--mut);font-variant-numeric:tabular-nums;flex:none}
  .vol{width:92px;height:4px;border-radius:99px;background:var(--wash);position:relative;flex:none}
  .vol>i{position:absolute;inset:0 35% 0 0;background:var(--mut);border-radius:99px}
</style>

<header>
  <span class="brand">music-robot</span>
  <nav>
    <a class="on" href="#">曲库</a><a href="#">专辑</a><a href="#">歌手</a><a href="#">歌单</a>
  </nav>
  <span class="spacer"></span>
  <div class="task"><span class="dot"></span>刮削中 3/8</div>
  <div class="search">搜索歌曲、专辑、歌手…</div>
  <div class="me"></div>
</header>

    <div class="card"><div class="cover">♪</div><div class="t1">平凡的一天</div><div class="t2">毛不易</div></div>
    <div class="card"><div class="cover">♪</div><div class="t1">2015 江苏卫视跨年</div><div class="t2">筷子兄弟</div></div>
    <div class="card"><div class="cover">♪</div><div class="t1">华夏传说</div><div class="t2">凤凰传奇</div></div>
    <div class="card"><div class="cover">♪</div><div class="t1">Camila</div><div class="t2">Camila Cabello</div></div>
    <div class="card"><div class="cover">♪</div><div class="t1">最美情侣</div><div class="t2">白小白</div></div>

  <h2 style="margin-top:34px">常听的歌手</h2>
  <div class="grid">
    <div class="card"><div class="cover">人</div><div class="t1">毛不易</div><div class="t2">12 首</div></div>
    <div class="card"><div class="cover">人</div><div class="t1">凤凰传奇</div><div class="t2">8 首</div></div>
    <div class="card"><div class="cover">人</div><div class="t1">筷子兄弟</div><div class="t2">5 首</div></div>
    <div class="card"><div class="cover">人</div><div class="t1">银临</div><div class="t2">4 首</div></div>

  <h2 style="margin-top:34px">我建的歌单</h2>
  <div class="grid">
    <div class="card"><div class="cover">≡</div><div class="t1">深夜单曲循环</div><div class="t2">23 首</div></div>
    <div class="card"><div class="cover">≡</div><div class="t1">开车听</div><div class="t2">41 首</div></div>

</main>

  <div class="now"><div class="t1">牵丝戏</div><div class="t2">银临 / Aki阿杰</div></div>
  <div class="ctrls">
    <div class="btn"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5h2.5l7 6H14"/><path d="M2 11h2.5l7-6H14"/><path d="M12 3.2 14 5l-2 1.8"/><path d="M12 9.2 14 11l-2 1.8"/></svg></div>
    <div class="btn"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4v8l-6-4z" fill="currentColor"/><path d="M3.5 4v8"/></svg></div>

    <div class="btn"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a5 5 0 0 1 5-5h3.5"/><path d="M9.5 1.2 11.7 3 9.5 4.8"/><path d="M13 8a5 5 0 0 1-5 5H4.5"/><path d="M6.5 14.8 4.3 13l2.2-1.8"/></svg></div>

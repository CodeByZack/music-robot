[package]
name = "music-tag"
version = "0.1.0"
edition = "2021"
description = "音乐标签清洗工具（Rust 自研读写层，零依赖）"

[dependencies]
encoding_rs = "0.8.42"
# 标签读写层**零依赖**（不使用 lofty / id3 等第三方标签库，全部自研）。
# 唯一例外：encoding_rs —— GB18030 码表。TS 侧靠 Node/V8 内置 TextDecoder('gb18030') 获得该能力，
# Rust std 只有 UTF-8/UTF-16，属平台能力缺口而非标签逻辑外包。Firefox 维护、纯 Rust、无 C 依赖。

[dev-dependencies]
# 仅测试用：解析 TS 参照实现输出的 JSON。产品代码保持零依赖。
serde_json = "1"

[lib]
name = "music_tag"
path = "src/lib.rs"

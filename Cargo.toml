[package]
name = "music-tag"
version = "0.1.0"
edition = "2021"
description = "音乐标签清洗工具（Rust 自研读写层，零依赖）"

[dependencies]
encoding_rs = "0.8.42"
sha2 = "0.11.0"
# serde_json：仅用于 CLI 的 --json 输出。与 encoding_rs/sha2 同类——平台能力补位
# （Node 侧是运行时内置 JSON），不是标签逻辑外包。不引入 serde derive，只手写 Value。
serde_json = "1"
# 标签读写层**全部自研**：不使用 lofty / id3 等任何第三方标签库。
# 下面两个是「平台能力补位」，不是标签逻辑外包——它们在 TS 侧同样由 Node 运行时免费提供：
#   encoding_rs : GB18030 码表（Node 内置 TextDecoder('gb18030')）
#   sha2        : 裸音频完整性 hash（Node 内置 crypto.createHash('sha256')）
#                 ⚠️ 不能用 std 的 DefaultHasher 替代：它不保证跨版本稳定，无法承担
#                    「绝不损坏音频」的校验职责，也无法与 TS 侧输出对拍。

[dev-dependencies]

[lib]
name = "music_tag"
path = "src/lib.rs"
